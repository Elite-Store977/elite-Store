<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details | Elite Store</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
<h1>🛍️ Elite Store</h1>
</div>

<nav>

<a href="index.html">Home</a>
<a href="#">Products</a>
<a href="#">Contact</a>

</nav>

</header>



<section class="product-detail">


<img id="productImage" src="">

<div class="info">

<h2 id="productName">Product Name</h2>
  
<div>
⭐⭐⭐⭐⭐
</div>

<h3 id="productPrice">$0</h3>


<p id="productDescription">
Product description
</p>


<button onclick="addProductToCart()">
Add To Cart 🛒
</button>


<button onclick="buyProduct()">
Buy Now ⚡
</button>


</div>


</section>



<section class="reviews">

<h2>Product Reviews</h2>

<div class="review-card">

⭐⭐⭐⭐⭐

<p>Excellent quality product!</p>

</div>


<div class="review-card">

⭐⭐⭐⭐

<p>Fast delivery and good service.</p>

</div>

</section>



<script src="script.js"></script>


<script>

let params = new URLSearchParams(window.location.search);

let name = params.get("name");
let price = params.get("price");


document.getElementById("productName").innerHTML = name;

document.getElementById("productPrice").innerHTML = "$" + price;


let images = {

"Smart Watch":"audionic-the-sound-master-black-dany-amoled-pulse-pro-smart-watch-36385408090268copy.webp",

"Wireless Earbuds":"248f59e7fd0d996952abb9a5bb2ee32c.jpg",

"Gaming Mouse":"m9_gaming_mouse_studio-1024x1024.webp",

"Bluetooth Speaker":"002f18ec-c5f2-4040-be3d-88cefaba30eb.webp"

};


document.getElementById("productImage").src = images[name];


function addProductToCart(){

addToCart(name,Number(price));

}
  
function buyProduct(){

buyNow(name,Number(price));

}
let descriptions = {

"Smart Watch":
"Premium smart watch with health tracking, fitness modes and long battery life.",

"Wireless Earbuds":
"High quality wireless earbuds with clear sound and noise reduction.",

"Gaming Mouse":
"Fast gaming mouse with accurate control and comfortable design.",

"Bluetooth Speaker":
"Portable Bluetooth speaker with powerful sound and long battery backup."

};


document.getElementById("productDescription").innerHTML =
descriptions[name] || "Premium quality product from Elite Store.";
  
</script>


</body>

</html>
