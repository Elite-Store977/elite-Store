<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart | Elite Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🛍️ Elite Store</h1>
<a href="index.html">⬅ Continue Shopping</a>
</header>

<section class="cart-page">

<h2>Your Shopping Cart 🛒</h2>

<div id="cart-items"></div>

<h2 id="total">Total: $0</h2>

<a href="checkout.html">
<button>Proceed To Checkout 💳</button>
</a>

</section>

<footer>
<p>© 2026 Elite Store</p>
</footer>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let cartBox = document.getElementById("cart-items");
let total = 0;

if(cart.length === 0){

    cartBox.innerHTML = "<h3>Your Cart Is Empty 😔</h3>";

}else{

    cart.forEach((item,index)=>{

        total += Number(item.price);

        cartBox.innerHTML += `
        <div style="border:2px solid black;padding:20px;margin:20px;background:white;">
            <h3>${item.name}</h3>
            <p>Price: $${item.price}</p>

            <button style="background:red;color:white;padding:10px 20px;border:none;cursor:pointer;"
                onclick="removeItem(${index})">
                ❌ Remove Item
            </button>
        </div>
        `;

    });

}

document.getElementById("total").innerHTML =
"Total: $" + total;

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem("cart",JSON.stringify(cart));

    location.reload();

}

</script>

</body>
</html>
