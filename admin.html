<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Store | Admin</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<script>

let password = prompt("Enter Admin Password");

if(password !== "faiq elite"){
    alert("Access Denied!");
    window.location.href = "index.html";
}


</script>
  
<header>
<h1>🛍️ Elite Store Admin</h1>
</header>

<section>

<h2>Orders</h2>

<div class="dashboard">

<div class="card-box">
<h3 id="totalOrders">0</h3>
<p>Total Orders</p>
</div>

<div class="card-box">
<h3 id="pendingOrders">0</h3>
<p>Pending Orders</p>
</div>

<div class="card-box">
<h3 id="deliveredOrders">0</h3>
<p>Delivered Orders</p>
</div>

<div class="card-box">
<h3 id="sales">$0</h3>
<p>Total Sales</p>
</div>

</div>
    
<input
type="text"
id="search"
placeholder="🔍 Search by Name or Phone..."
onkeyup="searchOrders()">
    
<div id="orders"></div>

</section>


<script>

let orders = JSON.parse(localStorage.getItem("orders")) || [];
    
orders.reverse();
    
console.log(orders);
  
let box = document.getElementById("orders");

let totalSales = 0;

document.getElementById("totalOrders").innerHTML = orders.length;

document.getElementById("pendingOrders").innerHTML = pending;

document.getElementById("deliveredOrders").innerHTML = delivered;
    
orders.forEach((order,index) => {

if(order.status === "Delivered"){
   totalSales += Number(order.grandTotal || 0);
}
  
box.innerHTML += `

<div class="cart-card">

<h3>Order ID: ${order.id}</h3>

<p>Customer: ${order.name}</p>

<p>Phone: ${order.phone}</p>

<p>Address: ${order.address}</p>

<p>Payment: ${order.payment}</p>

<p>Total: $${order.total}</p>

<p>Delivery: $${order.delivery}</p>

<p>Grand Total: $${order.grandTotal}</p>

<p>Products: ${order.products}</p>

<p>Status: ${order.status || "Pending"}</p>

<button onclick="completeOrder(${index})">
✅ Delivered
</button>

<button onclick="deleteOrder(${index})">
🗑️ Delete
</button>

</div>


`;

});

document.getElementById("totalOrders").innerHTML = orders.length;

let pending = orders.filter(order => 
order.status !== "Delivered"
).length;

let delivered = orders.filter(order =>
order.status === "Delivered"
).length;


document.getElementById("pendingOrders").innerHTML = pending;

document.getElementById("deliveredOrders").innerHTML = delivered;

document.getElementById("sales").innerHTML =
"Total Sales: $" + totalSales;
  
function completeOrder(index){

orders[index].status = "Delivered";

localStorage.setItem("orders", JSON.stringify(orders));

location.reload();

}


function deleteOrder(index){

orders.splice(index,1);

localStorage.setItem("orders", JSON.stringify(orders));

location.reload();

}

function searchOrders(){

let input = document.getElementById("search").value.toLowerCase();

let cards = document.getElementsByClassName("cart-card");


for(let i=0; i<cards.length; i++){

let text = cards[i].innerText.toLowerCase();


if(text.includes(input)){

cards[i].style.display="block";

}else{

cards[i].style.display="none";

}

}

}
    
</script>


</body>

</html>
