<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Store | Admin</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<script>

let password = prompt("Enter Admin Password");

if(password !== "faiq elite"){
    alert("Access Denied!");
    window.location.href = "index.html";
}


</script>
  
<header>
<h1>🛍️ Elite Store Admin</h1>
</header>

<section>

<h2>Orders</h2>

<h3 id="sales">Total Sales: $0</h3>
  
<div id="orders"></div>

</section>


<script>

let orders = JSON.parse(localStorage.getItem("orders")) || [];

console.log(orders);
  
let box = document.getElementById("orders");

let totalSales = 0;

orders.forEach((order,index) => {

if(order.status === "Delivered"){
    totalSales += Number(order.total || 0);
}
  
box.innerHTML += `

<div class="cart-card">

<h3>Order ID: ${order.id}</h3>

<p>Customer: ${order.name}</p>

<p>Phone: ${order.phone}</p>

<p>Address: ${order.address}</p>

<p>Products: ${order.products}</p>

<p>Status: ${order.status || "Pending"}</p>

<button onclick="completeOrder(${index})">
✅ Delivered
</button>

<button onclick="deleteOrder(${index})">
🗑️ Delete
</button>

</div>


`;

});

document.getElementById("sales").innerHTML =
"Total Sales: $" + totalSales;
  
function completeOrder(index){

orders[index].status = "Delivered";

localStorage.setItem("orders", JSON.stringify(orders));

location.reload();

}


function deleteOrder(index){

orders.splice(index,1);

localStorage.setItem("orders", JSON.stringify(orders));

location.reload();

}


</script>


</body>

</html>
