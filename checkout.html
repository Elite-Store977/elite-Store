<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Store | Checkout</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header>

<h1>💳 Checkout</h1>

<a href="index.html">
Back To Shop
</a>

</header>


<section class="checkout">

<h2>Customer Information</h2>

<input type="text" placeholder="Full Name">

<input type="text" placeholder="Phone Number">

<textarea placeholder="Complete Address"></textarea>


<h2>Payment</h2>

<select>

<option>Cash On Delivery</option>

<option>Online Payment</option>

</select>


<button onclick="placeOrder()">
Place Order ✅
</button>


</section>


<script>

function placeOrder(){

let name = document.querySelector("input").value;

let phone = document.querySelectorAll("input")[1].value;

let address = document.querySelector("textarea").value;


let message =
"New Order - Elite Store%0A%0A" +
"Name: " + name +
"%0APhone: " + phone +
"%0AAddress: " + address;


window.open(
"https://wa.me/923191346088?text=" + message,
"_blank"
);


localStorage.removeItem("cart");

}
}

</script>


</body>
</html>
