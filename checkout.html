<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Store | Checkout</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header>

<h1>💳 Checkout</h1>

<a href="index.html">
Back To Shop
</a>

</header>


<section class="checkout">

<h2>Customer Information</h2>

<input type="text" placeholder="Full Name">

<input type="text" placeholder="Phone Number">

<textarea placeholder="Complete Address"></textarea>


<h2>Payment</h2>

<select>

<option>Cash On Delivery</option>

<option>Online Payment</option>

</select>


<button onclick="placeOrder()">
Place Order ✅
</button>


</section>


<script>

function placeOrder(){

let name = document.querySelector("input").value;

let phone = document.querySelectorAll("input")[1].value;

let address = document.querySelector("textarea").value;

if(name == "" || phone == "" || address == ""){
    alert("Please fill all details");
    return;
}

let orderID = "ELITE-" + Math.floor(Math.random()*100000);



let cart = JSON.parse(localStorage.getItem("cart")) || [];

let products = "";

let total = 0;
    
cart.forEach(item => {

total += item.price * item.quantity;

products += 
"%0A" + item.name +
" | Qty: " + item.quantity +
" | Price: $" + item.price;

});


let message =
"🛍️ Elite Store New Order%0A%0A" +
"Order ID: " + orderID +
"%0A%0AProducts:" +
products +
"%0A%0AName: " + name +
"%0APhone: " + phone +
"%0AAddress: " + address;


window.open(
"https://wa.me/923191346088?text=" + message,
"_blank"
);


let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push({

id: orderID,

name: name,

phone: phone,

address: address,

products: products,

total: total

date: new Date().toLocaleString(),
    
});


localStorage.setItem("orders", JSON.stringify(orders));

console.log(localStorage.getItem("orders"));
    
localStorage.removeItem("cart");

}
  

</script>


</body>
</html>
