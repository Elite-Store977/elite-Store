<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Store | Checkout</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>💳 Checkout</h1>

<a href="index.html">
Back To Shop
</a>

</header>



<section class="checkout">


<div class="cart-summary">

<h2>Your Order</h2>

<div id="orderItems"></div>

<h3 id="orderTotal"></h3>

</div>



<h2>Customer Information</h2>


<input id="name" type="text" placeholder="Full Name">


<input id="phone" type="text" placeholder="Phone Number">


<textarea id="address" placeholder="Complete Address"></textarea>



<h2>Payment</h2>


<select id="payment">

<option>Cash On Delivery</option>

<option>Online Payment</option>

</select>



<button onclick="placeOrder()">

Place Order ✅

</button>



</section>




<script>


let cart = JSON.parse(localStorage.getItem("cart")) || [];


let orderItems = document.getElementById("orderItems");

let orderTotal = document.getElementById("orderTotal");


let subtotal = 0;

let delivery = subtotal >= 50 ? 0 : 5;



// Show Cart


if(cart.length === 0){


orderItems.innerHTML =

"<p>Your cart is empty!</p>";


orderTotal.innerHTML =

"Total: $0";


}



cart.forEach(item => {


let qty = item.quantity || 1;


let price = item.price * qty;


subtotal += price;



orderItems.innerHTML +=

`

<p>

${item.name}

x ${qty}

= $${price}

</p>

`;



});



let grandTotal = subtotal + delivery;



if(cart.length > 0){


orderTotal.innerHTML =

`

Subtotal: $${subtotal}

<br>

Delivery: $${delivery}

<br>

<b>Grand Total: $${grandTotal}</b>

`;



}




function placeOrder(){



if(cart.length === 0){


alert("Your cart is empty!");

return;


}



let name = document.getElementById("name").value;

let phone = document.getElementById("phone").value;

let address = document.getElementById("address").value;

let payment = document.getElementById("payment").value;



if(name=="" || phone=="" || address==""){


alert("Please fill all details");

return;


}




let orderID =

"ELITE-" + Math.floor(Math.random()*100000);



let products = "";



cart.forEach(item=>{


products +=

"\n" +

item.name +

" | Qty: " +

(item.quantity || 1) +

" | Price: $" +

item.price;



});





let message =


"🛍️ Elite Store New Order\n\n" +

"Order ID: " + orderID +

"\nDate: " + new Date().toLocaleString() +

"\n\nProducts:" +

products +

"\n\nName: " + name +

"\nPhone: " + phone +

"\nAddress: " + address +

"\nPayment: " + payment +

"\n\nSubtotal: $" + subtotal +

"\nDelivery: $" + delivery +

"\nGrand Total: $" + grandTotal;




window.open(

"https://wa.me/923191346088?text=" +

encodeURIComponent(message),

"_blank"

);





// Save Orders


let orders = JSON.parse(localStorage.getItem("orders")) || [];



orders.push({


id: orderID,

name: name,

phone: phone,

address: address,

payment: payment,

products: products,

subtotal: subtotal,

delivery: delivery,

grandTotal: grandTotal,

date: new Date().toLocaleString()



});



localStorage.setItem(

"orders",

JSON.stringify(orders)

);




localStorage.removeItem("cart");



alert("Order Placed Successfully ✅");



setTimeout(()=>{


window.location.href="index.html";


},1000);



}


</script>

<script src="script.js"></script>

</body>

</html>
