<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Store | Checkout</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<header>

<h1>💳 Checkout</h1>

<a href="index.html">
Back To Shop
</a>

</header>


<section class="checkout">

<h2>Customer Information</h2>

<input type="text" placeholder="Full Name">

<input type="text" placeholder="Phone Number">

<textarea placeholder="Complete Address"></textarea>


<h2>Payment</h2>

<select>

<option>Cash On Delivery</option>

<option>Online Payment</option>

</select>


<button onclick="placeOrder()">
Place Order ✅
</button>


</section>


<script>

function placeOrder(){

let name = document.querySelector("input").value;

let phone = document.querySelectorAll("input")[1].value;

let address = document.querySelector("textarea").value;

let payment = document.querySelector("select").value;

if(name == "" || phone == "" || address == ""){
    alert("Please fill all details");
    return;
}

let orderID = "ELITE-" + Math.floor(Math.random()*100000);



let cart = JSON.parse(localStorage.getItem("cart")) || [];
    
if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
}
    
let products = "";

let total = 0;

let delivery = 5;   // Delivery Charges
    
cart.forEach(item => {

total += item.price * item.quantity;

products +=
"\n" + item.name +
" | Qty: " + item.quantity +
" | Price: $" + item.price;
   
});
    
let grandTotal = total + delivery;

let message =
"🛍️ Elite Store New Order\n\n" +
"Order ID: " + orderID +
"\nDate: " + new Date().toLocaleString() +
"\n\nProducts:" +
products.replaceAll("%0A", "\n") +
"\n\nName: " + name +
"\nPhone: " + phone +
"\nAddress: " + address +
"\nPayment: " + payment +
"\n\nSubtotal: $" + total +
"\nDelivery: $" + delivery +
"\nGrand Total: $" + grandTotal;
    
window.open(
"https://wa.me/923191346088?text=" + encodeURIComponent(message),
"_blank"
);


let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push({

id: orderID,

name: name,

phone: phone,

address: address,

payment: payment,

products: products,

total: total,

delivery: delivery,

grandTotal: grandTotal,

date: new Date().toLocaleString()

});

localStorage.setItem("orders", JSON.stringify(orders));

localStorage.removeItem("cart");

alert("Order Placed Successfully ✅");

setTimeout(() => {
    window.location.href = "index.html";
}, 1000);

}

</script>


</body>
</html>
